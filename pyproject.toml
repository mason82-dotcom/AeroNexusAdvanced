[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronexusadvanced"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Only collect the application test suite. Pi deployments also contain a
# Git-ignored, Docker-owned cloud-server/edge/data tree (MySQL and Redis);
# collecting from project root must never scan those private databases.
testpaths = ["tests"]
norecursedirs = [".*", "cloud-server", "node_modules", "build", "dist"]
