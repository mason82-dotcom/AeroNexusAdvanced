name: tests
on: [push, pull_request]
jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/maintenance/check_markdown_links.py
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,mqtt,minio,multispectral,raster,ui-browser]'
      - name: Fetch verified Leaflet 1.9.4 for offline UI smoke
        run: |
          python scripts/pi/fetch_leaflet_test_assets.py --output "$RUNNER_TEMP/aeronexus-leaflet"
          echo "AERONEXUS_LEAFLET_TEST_ASSETS=$RUNNER_TEMP/aeronexus-leaflet" >> "$GITHUB_ENV"
      - name: Offline status performance sample (synthetic data)
        if: github.event_name == 'pull_request'
        run: python scripts/maintenance/benchmark_refactor.py --devices 40 --events 1600 --iterations 25
      - run: pytest -q
